version: 0.2

env:
  variables:
    BUCKET_NAME: ""
    S3_KEY: "data/tools-docker.json"

phases:
  pre_build:
    commands:
      - echo "Pulling Docker images..."
  build:
    commands:
      - |
        cat > /tmp/measure.sh << 'EOF'
        #!/bin/bash

        measure_tool() {
          local id=$1
          local image=$2
          local port=${3:-4566}
          local health_path=${4:-"/_localstack/health"}
          local use_https=${5:-"false"}

          echo "=== $id: pulling $image ===" >&2
          docker pull "$image" 2>/dev/null || { echo "{\"id\":\"$id\",\"error\":\"pull failed\"}"; return; }

          SIZE=$(docker images "$image" --format "{{.Size}}" | head -1)

          echo "=== $id: starting container ===" >&2
          CONTAINER_ID=$(docker run -d -p ${port}:${port} "$image" 2>/dev/null)
          if [ -z "$CONTAINER_ID" ]; then
            echo "{\"id\":\"$id\",\"error\":\"container start failed\"}"
            return
          fi

          STARTUP_START=$(date +%s%N)
          for i in $(seq 1 60); do
            if [ "$use_https" = "true" ]; then
              curl -sfk "https://localhost:${port}${health_path}" > /dev/null 2>&1 && break
            else
              curl -sf "http://localhost:${port}${health_path}" > /dev/null 2>&1 && break
            fi
            sleep 0.5
          done
          STARTUP_END=$(date +%s%N)
          STARTUP_MS=$(( (STARTUP_END - STARTUP_START) / 1000000 ))

          MEMORY=$(docker stats --no-stream --format "{{.MemUsage}}" "$CONTAINER_ID" 2>/dev/null | cut -d'/' -f1 | xargs)

          if [ "$use_https" = "true" ]; then
            HEALTH=$(curl -sfk "https://localhost:${port}${health_path}" 2>/dev/null || echo "{}")
          else
            HEALTH=$(curl -sf "http://localhost:${port}${health_path}" 2>/dev/null || echo "{}")
          fi

          docker stop "$CONTAINER_ID" > /dev/null 2>&1
          docker rm "$CONTAINER_ID" > /dev/null 2>&1

          echo "{\"id\":\"$id\",\"imageSize\":\"$SIZE\",\"startupMs\":$STARTUP_MS,\"memoryIdle\":\"$MEMORY\",\"health\":$HEALTH}"
        }

        RESULTS=()

        R=$(measure_tool "localstack" "localstack/localstack:latest" 4566 "/_localstack/health")
        RESULTS+=("$R")

        R=$(measure_tool "ministack" "ministackorg/ministack:latest" 4567 "/_ministack/health")
        RESULTS+=("$R")

        R=$(measure_tool "floci" "floci/floci:latest" 4568 "/_localstack/health")
        RESULTS+=("$R")

        R=$(measure_tool "robotocore" "jackdanger/robotocore:latest" 4569 "/_robotocore/health")
        RESULTS+=("$R")

        # Build JSON array manually to avoid malformed output on partial failures
        printf '[' > /tmp/results.json
        for i in "${!RESULTS[@]}"; do
          if [ $i -gt 0 ]; then printf ',' >> /tmp/results.json; fi
          printf '%s' "${RESULTS[$i]}" >> /tmp/results.json
        done
        printf ']' >> /tmp/results.json

        echo "=== Final results ===" >&2
        cat /tmp/results.json >&2
        EOF
        chmod +x /tmp/measure.sh
        bash /tmp/measure.sh

  post_build:
    commands:
      - echo "Uploading results to S3..."
      - aws s3 cp /tmp/results.json "s3://${BUCKET_NAME}/${S3_KEY}" --content-type application/json
      - echo "Done"

artifacts:
  files:
    - /tmp/results.json
  discard-paths: yes
