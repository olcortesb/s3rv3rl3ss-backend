AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: s3rv3rl3ss-backend - Collects AWS serverless data daily and commits to repo

Parameters:
  Schedule:
    Type: String
    Default: cron(0 6 * * ? *)
    Description: EventBridge schedule for data collection (daily at 6:00 UTC)
Globals:
  Function:
    Runtime: python3.12
    Timeout: 300
    MemorySize: 256

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub s3rv3rl3ss-data-${AWS::AccountId}
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: CleanOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      VersioningConfiguration:
        Status: Enabled

  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.lambda_handler
      CodeUri: src/collector/
      Description: Collects AWS serverless data, quotas, pricing, news and limits
      Architectures:
        - arm64
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          S3_KEY: data/services-aws.json
          TABLE_NAME: !Ref DataTable
          CLOUDFRONT_DISTRIBUTION_ID: !Ref DataDistribution
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action:
                - servicequotas:GetServiceQuota
                - servicequotas:ListServiceQuotas
                - servicequotas:ListAWSDefaultServiceQuotas
                - pricing:GetProducts
                - pricing:DescribeServices
                - cloudfront:CreateInvalidation
              Resource: '*'
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: cron(0 6 * * ? *)
            Description: Triggers daily AWS data collection
            Enabled: true

  GcpCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.lambda_handler
      CodeUri: src/gcp-collector/
      Description: Collects GCP serverless data, pricing, news and limits
      Architectures:
        - arm64
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          S3_KEY: data/services-gcp.json
          STATISTICS_KEY: data/statistics-gcp.json
          TABLE_NAME: !Ref DataTable
          CLOUDFRONT_DISTRIBUTION_ID: !Ref DataDistribution
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action:
                - cloudfront:CreateInvalidation
              Resource: '*'
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: cron(15 6 * * ? *)
            Description: Triggers daily GCP data collection (15 min after AWS)
            Enabled: true

  AzureCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.lambda_handler
      CodeUri: src/azure-collector/
      Description: Collects Azure serverless data, pricing and limits
      Architectures:
        - arm64
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          S3_KEY: data/services-azure.json
          STATISTICS_KEY: data/statistics-azure.json
          TABLE_NAME: !Ref DataTable
          CLOUDFRONT_DISTRIBUTION_ID: !Ref DataDistribution
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action:
                - cloudfront:CreateInvalidation
              Resource: '*'
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: cron(30 6 * * ? *)
            Description: Triggers daily Azure data collection (30 min after AWS)
            Enabled: true

  StackitCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.lambda_handler
      CodeUri: src/stackit-collector/
      Description: Collects STACKIT cloud data, pricing and news
      Architectures:
        - arm64
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          S3_KEY: data/services-stackit.json
          STATISTICS_KEY: data/statistics-stackit.json
          CHANGELOG_KEY: data/changelog-stackit.json
          TABLE_NAME: !Ref DataTable
          CLOUDFRONT_DISTRIBUTION_ID: !Ref DataDistribution
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action:
                - cloudfront:CreateInvalidation
              Resource: '*'
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: cron(35 6 * * ? *)
            Description: Triggers daily STACKIT data collection (35 min after AWS)
            Enabled: true

  ComparisonsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.lambda_handler
      CodeUri: src/comparisons/
      Description: Generates comparisons.json from all provider data
      Architectures:
        - arm64
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          S3_KEY: data/comparisons.json
          CLOUDFRONT_DISTRIBUTION_ID: !Ref DataDistribution
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - Statement:
            - Effect: Allow
              Action:
                - cloudfront:CreateInvalidation
              Resource: '*'
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: cron(45 6 * * ? *)
            Description: Generates comparisons after all collectors finish
            Enabled: true

  ToolsCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.lambda_handler
      CodeUri: src/tools-collector/
      Description: Collects version info for local dev tools from GitHub
      Architectures:
        - arm64
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          S3_KEY: data/tools.json
          DOCKER_PROJECT_NAME: !Ref ToolsDockerProject
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - Statement:
            - Effect: Allow
              Action:
                - codebuild:StartBuild
                - codebuild:BatchGetBuilds
              Resource: !GetAtt ToolsDockerProject.Arn
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: cron(0 7 * * ? *)
            Description: Collects local dev tools data daily (1h after providers)
            Enabled: true

  ToolsDockerProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: s3rv3rl3ss-tools-docker
      Description: Pulls and measures Docker images for AWS local dev tools
      ServiceRole: !GetAtt ToolsDockerRole.Arn
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - echo "Logging into Docker Hub..."
                - DOCKER_CREDS=$(aws secretsmanager get-secret-value --secret-id s3rv3rl3ss/dockerhub --region us-east-1 --query SecretString --output text)
                - echo $DOCKER_CREDS | python3 -c "import sys,json;c=json.load(sys.stdin);print(c['password'])" | docker login -u $(echo $DOCKER_CREDS | python3 -c "import sys,json;c=json.load(sys.stdin);print(c['username'])") --password-stdin
                - export LOCALSTACK_AUTH_TOKEN=$(aws secretsmanager get-secret-value --secret-id s3rv3rl3ss/localstack --region us-east-1 --query SecretString --output text | python3 -c "import sys,json;print(json.load(sys.stdin)['auth_token'])")
                - echo "Pre-pulling all images..."
                - docker pull localstack/localstack:latest
                - docker pull ministackorg/ministack:latest
                - docker pull floci/floci:latest
                - docker pull jackdanger/robotocore:latest
            build:
              commands:
                - |
                  measure_tool() {
                    local id=$1 image=$2 port=$3 health=$4
                    echo "=== Measuring $id ==="
                    if ! docker image inspect "$image" > /dev/null 2>&1; then
                      echo "ERROR: Image $image not found locally"
                      echo "{\"id\":\"$id\",\"imageSize\":\"\",\"startupMs\":0,\"memoryIdle\":\"\",\"services\":[]}" >> /tmp/results.json
                      return
                    fi
                    SIZE=$(docker images "$image" --format "{{.Size}}" | head -1)
                    CONTAINER_ID=$(docker run -d -p ${port}:4566 ${EXTRA_ENV:-} "$image")
                    echo "Container: $CONTAINER_ID"
                    START=$(date +%s%N)
                    for i in $(seq 1 90); do
                      curl -sf "http://localhost:${port}${health}" > /dev/null 2>&1 && break
                      sleep 0.5
                    done
                    END=$(date +%s%N)
                    MS=$(( (END - START) / 1000000 ))
                    echo "Startup: ${MS}ms"
                    sleep 3
                    MEM=$(docker stats --no-stream --format "{{.MemUsage}}" "$CONTAINER_ID" 2>/dev/null | cut -d'/' -f1 | xargs)
                    HEALTH_RESP=$(curl -sf "http://localhost:${port}${health}" 2>/dev/null || echo "{}")
                    echo "Health response length: $(echo $HEALTH_RESP | wc -c)"
                    docker stop "$CONTAINER_ID" > /dev/null 2>&1
                    docker rm "$CONTAINER_ID" > /dev/null 2>&1
                    echo "{\"id\":\"$id\",\"imageSize\":\"$SIZE\",\"startupMs\":$MS,\"memoryIdle\":\"$MEM\",\"health\":$HEALTH_RESP}" >> /tmp/results.json
                  }
                  echo "[" > /tmp/results.json
                  EXTRA_ENV="-e LOCALSTACK_AUTH_TOKEN=$LOCALSTACK_AUTH_TOKEN" measure_tool "localstack" "localstack/localstack:latest" 4566 "/_localstack/health"
                  echo "," >> /tmp/results.json
                  measure_tool "ministack" "ministackorg/ministack:latest" 4567 "/_ministack/health"
                  echo "," >> /tmp/results.json
                  measure_tool "floci" "floci/floci:latest" 4568 "/_localstack/health"
                  echo "," >> /tmp/results.json
                  measure_tool "robotocore" "jackdanger/robotocore:latest" 4569 "/_robotocore/health"
                  echo "]" >> /tmp/results.json
                  echo "=== Final results ==="
                  cat /tmp/results.json
            post_build:
              commands:
                - aws s3 cp /tmp/results.json "s3://${BUCKET_NAME}/${S3_KEY}" --content-type application/json
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: BUCKET_NAME
            Value: !Ref DataBucket
          - Name: S3_KEY
            Value: data/tools-docker.json
      Artifacts:
        Type: NO_ARTIFACTS
      TimeoutInMinutes: 15

  ToolsDockerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ToolsDockerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${DataBucket.Arn}/data/tools-docker.json"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:us-east-1:${AWS::AccountId}:secret:s3rv3rl3ss/dockerhub-*"
                  - !Sub "arn:aws:secretsmanager:us-east-1:${AWS::AccountId}:secret:s3rv3rl3ss/localstack-*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  ChangelogFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.lambda_handler
      CodeUri: src/changelog/
      Description: Generates changelog JSONs from DynamoDB for all providers
      Architectures:
        - arm64
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          TABLE_NAME: !Ref DataTable
          CLOUDFRONT_DISTRIBUTION_ID: !Ref DataDistribution
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - DynamoDBReadPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action:
                - cloudfront:CreateInvalidation
              Resource: '*'
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: cron(50 6 * * ? *)
            Description: Generates changelogs after all collectors finish
            Enabled: true

  MetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.lambda_handler
      CodeUri: src/metrics/
      Description: Generates project infrastructure metrics from CloudWatch
      Architectures:
        - arm64
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          TABLE_NAME: !Ref DataTable
          S3_KEY: data/metrics.json
          CLOUDFRONT_DISTRIBUTION_ID: !Ref DataDistribution
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - DynamoDBReadPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:GetMetricStatistics
                - lambda:ListFunctions
                - cloudfront:CreateInvalidation
              Resource: '*'
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: cron(55 6 * * ? *)
            Description: Generates project metrics daily
            Enabled: true

  ReinventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.lambda_handler
      CodeUri: src/reinvent/
      Description: Generates reinvent.json dashboard data from DynamoDB CHANGE items
      Architectures:
        - arm64
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          TABLE_NAME: !Ref DataTable
          S3_KEY: data/reinvent.json
          CLOUDFRONT_DISTRIBUTION_ID: !Ref DataDistribution
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - DynamoDBReadPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action:
                - cloudfront:CreateInvalidation
              Resource: '*'
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: cron(0 */2 * * ? *)
            Description: Every 2h — handler skips based on date (active Nov 1 - Dec 7)
            Enabled: true

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${DataBucket.Arn}/data/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DataDistribution}'

  DataOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 's3rv3rl3ss-oac-${AWS::AccountId}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DataDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: s3rv3rl3ss data CDN
        DefaultCacheBehavior:
          TargetOriginId: DataBucketOrigin
          ViewerProtocolPolicy: https-only
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          ResponseHeadersPolicyId: !Ref DataResponseHeadersPolicy
        Origins:
          - Id: DataBucketOrigin
            DomainName: !GetAtt DataBucket.RegionalDomainName
            OriginAccessControlId: !Ref DataOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''

  DataResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub 's3rv3rl3ss-cors-${AWS::AccountId}'
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items: ['*']
          AccessControlAllowMethods:
            Items: [GET, HEAD]
          AccessControlAllowOrigins:
            Items:
              - https://s3rv3rl3ss.olcortesb.com
          OriginOverride: true

  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub s3rv3rl3ss-${AWS::AccountId}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true


Outputs:
  DataBucketName:
    Value: !Ref DataBucket
  DataDistributionUrl:
    Value: !Sub 'https://${DataDistribution.DomainName}'
    Description: CloudFront URL for frontend fetch() — use as VITE_CLOUDFRONT_URL
  DataDistributionId:
    Value: !Ref DataDistribution
  CollectorFunctionArn:
    Value: !GetAtt CollectorFunction.Arn
  GcpCollectorFunctionArn:
    Value: !GetAtt GcpCollectorFunction.Arn
  StackitCollectorFunctionArn:
    Value: !GetAtt StackitCollectorFunction.Arn
  AzureCollectorFunctionArn:
    Value: !GetAtt AzureCollectorFunction.Arn
  ComparisonsFunctionArn:
    Value: !GetAtt ComparisonsFunction.Arn
  ToolsCollectorFunctionArn:
    Value: !GetAtt ToolsCollectorFunction.Arn
  ChangelogFunctionArn:
    Value: !GetAtt ChangelogFunction.Arn
  MetricsFunctionArn:
    Value: !GetAtt MetricsFunction.Arn
  ReinventFunctionArn:
    Value: !GetAtt ReinventFunction.Arn
  DataTableName:
    Value: !Ref DataTable
